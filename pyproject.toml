[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-atlas"
version = "1.0.0"
description = "Policy-gated engineering assistant with LangGraph, MCP and document retrieval"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.11,<3", "pydantic-settings>=2.8,<3",
  "langgraph>=1.0,<2", "mcp==1.26.0", "httpx>=0.28,<1",
  "python-multipart>=0.0.20", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "beautifulsoup4>=4.13,<5", "PyJWT[crypto]>=2.10,<3", "openai>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]
search = ["faiss-cpu>=1.10,<2", "opensearch-py>=2.8,<4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.api" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

