# Local synthetic demonstration only. API and proxy share a network namespace;
# the API remains loopback-bound and the host publishes only a loopback port.
services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - atlas-data:/app/data/runtime
    environment:
      APP_ENV: development
      MODEL_MODE: demo
      AUTH_MODE: demo
      MCP_TRANSPORT: stdio
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
  gateway:
    image: nginx:1.28-alpine
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  atlas-data:

