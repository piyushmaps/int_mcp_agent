events { worker_connections 512; }
http {
  access_log off;
  server {
    listen 8080;
    server_name localhost;
    client_max_body_size 11m;
    location / {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host localhost;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 45s;
    }
  }
}

